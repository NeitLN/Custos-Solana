<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/custos-favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/custos-apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="Ví mẫu tích hợp Custos — xem hậu quả trước khi ký, gửi token trên Solana Devnet và đối chiếu kết quả thực thi."
    />
    <title>Custos — Ví mẫu trên Solana Devnet</title>
    <script>
      // TRANG CHÍNH — chỉ bản Vercel (`VITE_TRANG_CHINH=gioi-thieu` trong vercel.json): mở GỐC TRẦN
      // thì tới trang giới thiệu. Có hash (`#tx=…` bàn giao từ dApp) hoặc query (`?thucThi=1`), hay
      // đường dẫn khác gốc (`/vi`, `/index.html`) ⇒ vẫn là ví. Không đặt biến ⇒ không làm gì.
      (function () {
        if ("%VITE_TRANG_CHINH%" !== "gioi-thieu") return;
        var l = window.location;
        if (l.hash || l.search || !/\/$/.test(l.pathname)) return;
        l.replace(l.pathname + "gioi-thieu.html");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
